<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Mental Game · Merrill Bluejays Girls Wrestling</title>
<meta name="description" content="My Mental Game: 7 mental skills for Merrill Bluejays Girls Wrestling.">
<meta name="theme-color" content="#06111f">
<link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<style>
@font-face{font-family:Lexend;font-weight:400;src:url(lexend-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:Lexend;font-weight:600;src:url(lexend-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:Lexend;font-weight:800;src:url(lexend-latin-800-normal.woff2) format("woff2")}
:root{--navy:#06111f;--navy2:#0d1d33;--navy3:#16294a;--blue:#0866e8;--blue2:#4b93ff;--red:#ff2147;--ink:#f1f6ff;--mute:#9db0cb;--line:#25406a;--ok:#22c58b;--gold:#ffc53d;--r:18px}
*{box-sizing:border-box}html,body{margin:0;background:var(--navy);color:var(--ink);font-family:Lexend,system-ui,sans-serif;font-size:17px;line-height:1.45;-webkit-font-smoothing:antialiased}
a{color:var(--blue2)}button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
.wrap{max-width:760px;margin:0 auto;padding:0 16px calc(110px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:20;background:rgba(6,17,31,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
header .in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:9px 16px}header img{height:32px}header b{font-weight:800;font-size:15px;letter-spacing:.03em}header .sp{flex:1}
.pill{background:var(--navy3);border:1px solid var(--line);border-radius:30px;padding:5px 11px;font-size:13px;font-weight:600;color:var(--mute);text-decoration:none}
nav{position:fixed;bottom:0;left:0;right:0;z-index:30;background:rgba(6,17,31,.97);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
nav a{flex:1;max-width:110px;text-align:center;text-decoration:none;color:var(--mute);font-size:12px;font-weight:600;padding:5px 0;border-radius:12px}nav a .i{display:block;font-size:22px;line-height:1.1}nav a.on{color:#fff;background:var(--navy3)}
.dot{display:inline-block;min-width:17px;height:17px;border-radius:9px;background:var(--red);color:#fff;font-size:11px;line-height:17px;padding:0 4px}.dot[hidden]{display:none}
h1{font-size:32px;line-height:1.08;margin:18px 0 6px;font-weight:800}h2{font-size:23px;margin:20px 0 8px;font-weight:800}h3{font-size:18px;margin:14px 0 6px}
.hook{font-size:18px;color:#d6e5ff;margin:0 0 12px}.muted{color:var(--mute)}.small{font-size:14px}
.card{background:var(--navy2);border:1.5px solid var(--line);border-radius:var(--r);padding:16px;margin:12px 0}
.lab{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--blue2);margin-bottom:4px}
.tag{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;border-radius:20px;padding:3px 10px;margin-bottom:6px}
.tb{background:#fff;color:var(--navy)}.ts{background:#0a7d55;color:#fff}.tm{background:var(--blue);color:#fff}.ty{border:1.5px solid var(--red);color:#ff7a92}
.src{font-size:11px;color:var(--mute)}
.band{border-radius:22px;padding:18px;margin-top:16px;color:#fff;display:flex;gap:14px;align-items:center}.band .n{flex:none;width:56px;height:56px;border-radius:50%;background:#fff;font-weight:800;font-size:28px;display:flex;align-items:center;justify-content:center}.band h1{margin:0;font-size:28px}.band p{margin:2px 0 0;opacity:.95}
textarea,input[type=text],input[type=number],input[type=date],select{width:100%;background:#0a1628;color:var(--ink);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;font:inherit;font-size:16px}
textarea{min-height:80px;resize:vertical}textarea:focus,input:focus{outline:3px solid var(--blue);border-color:transparent}
label.l{display:block;font-weight:600;font-size:15px;margin:14px 0 6px}
.btn{background:var(--blue);color:#fff;border:0;border-radius:16px;padding:13px 18px;font-weight:800;font-size:16px}.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink)}.btn.red{background:var(--red)}.btn.ok{background:var(--ok);color:#03241a}.btn.sm{padding:8px 13px;font-size:14px;border-radius:12px}.btn.wide{width:100%}.btn:disabled{opacity:.4}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.sp{flex:1}
.grid{display:grid;gap:12px}.g2{grid-template-columns:1fr 1fr}@media(max-width:560px){.g2{grid-template-columns:1fr}}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.tile{display:block;text-decoration:none;color:#fff;border-radius:20px;padding:14px;min-height:120px;position:relative;border:0;text-align:left}
.tile .n{display:inline-flex;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.95);font-weight:800;align-items:center;justify-content:center;margin-bottom:8px}.tile b{display:block;font-size:17px;line-height:1.2}.tile .st{position:absolute;right:12px;top:14px;font-size:15px;letter-spacing:1px}
.tabs{display:flex;gap:8px;margin:14px 0 4px;overflow-x:auto}.tabs button{background:var(--navy2);border:1.5px solid var(--line);color:var(--mute);border-radius:30px;padding:9px 16px;font-weight:800;font-size:15px;white-space:nowrap}.tabs button.on{background:#fff;color:var(--navy)}
.moment{background:linear-gradient(135deg,#0c2244,#152a52);border-color:#2e5290}
.hide{display:none}.show{display:block!important;animation:f .3s}@keyframes f{from{opacity:0;transform:translateY(5px)}to{opacity:1}}
.flip{background:#0a1628;border:1.5px solid var(--line);border-radius:16px;padding:14px;margin:8px 0;cursor:pointer}.flip .a{display:none;color:#bdf2db;margin-top:6px}.flip.open .a{display:block}
.starrow{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}.starrow b{font-weight:600}
.stars button{background:none;border:0;font-size:26px;padding:0 2px;color:#3a5888;line-height:1}.stars button.on{color:var(--gold)}
.meter{display:flex;gap:4px;margin:8px 0}.meter button{flex:1;height:40px;border-radius:10px;border:2px solid var(--line);background:#0a1628;color:var(--ink);font-weight:800;font-size:15px;padding:0}.meter button.u{background:var(--blue);border-color:var(--blue)}.meter button.b{outline:3px solid var(--gold);outline-offset:1px}
.sortq{background:#0a1628;border:1.5px solid var(--line);border-radius:16px;padding:12px;margin:8px 0}.sortq q{display:block;font-weight:800;font-size:17px;margin-bottom:8px;quotes:none}.sortq.right{border-color:var(--ok)}.sortq.wrong{border-color:var(--red)}
.sortq button{background:var(--navy3);border:1.5px solid var(--line);color:var(--ink);border-radius:20px;padding:7px 12px;font-size:14px;font-weight:600;margin:2px}
.pacer{display:flex;flex-direction:column;align-items:center;padding:16px 0}
.ring{width:250px;height:250px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle,#124080 0,#0a1628 70%);border:4px solid var(--blue);transition:transform 4s linear,border-color .3s}.ring i{font-style:normal;font-weight:800;letter-spacing:.12em;color:#cfe0ff}.ring b{font-size:30px}.ring .c{font-size:52px;font-weight:800}
.stage{position:fixed;inset:0;background:var(--navy);z-index:50;display:none;flex-direction:column;align-items:center;justify-content:center;padding:28px;text-align:center}.stage.on{display:flex}.stage .l2{font-size:14px;letter-spacing:.2em;font-weight:800;color:var(--blue2)}.stage .t{font-size:clamp(26px,7vw,46px);font-weight:800;max-width:700px;margin:12px 0}.stage .bar{width:min(480px,80vw);height:8px;background:#1f3456;border-radius:8px;overflow:hidden;margin-top:18px}.stage .bar div{height:100%;background:var(--red);width:0}
.hab{text-align:center;margin:0}.hab .e{font-size:30px}.hab b{display:block;margin:2px 0 6px}.hab.done{border-color:var(--ok);background:#0c2a24}
.cnt{display:flex;justify-content:center;align-items:center;gap:8px}.cnt b{font-size:26px;min-width:34px;margin:0}
.dots span{display:inline-block;width:18px;height:18px;border-radius:50%;margin:2px;background:#1f3456}.dots span.on{background:var(--ok)}.dots span.td{background:transparent;border:2px dashed var(--ok)}
.big{font-size:34px;font-weight:800;line-height:1}
.hero{margin-top:14px;border-radius:24px;padding:20px;background:radial-gradient(circle at 88% 18%,rgba(8,102,232,.6),transparent 55%),radial-gradient(circle at 0 100%,rgba(255,33,71,.35),transparent 50%),var(--navy2);border:1.5px solid var(--line);position:relative;overflow:hidden}
.hero img{position:absolute;right:-10px;top:-4px;width:150px;opacity:.9}.hero .t1{font-size:22px;font-weight:800;color:#a9c8ff}.hero .t2{font-size:44px;font-weight:800;line-height:.95}.hero p{position:relative;max-width:360px}
.scard{background:#fff;color:var(--navy);border-radius:20px;padding:16px;max-width:420px}.scard h3{margin:0 0 6px;display:flex;gap:8px;align-items:center}.scard h3 img{height:28px}.scard .r{border-bottom:1.5px solid #c9d5e4;padding:8px 0;display:flex;gap:10px}.scard .r b{width:96px;flex:none;color:#0866e8;font-size:13px}
.gate{max-width:440px;margin:30px auto;text-align:center}.gate img{width:140px}.gbtn{display:inline-flex;gap:10px;align-items:center;justify-content:center;background:#fff;color:#1f1f1f;border:0;border-radius:30px;padding:13px 20px;font-weight:800;font-size:16px;width:100%}
.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:#fff;color:var(--navy);font-weight:800;padding:11px 18px;border-radius:30px;z-index:60;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis}.toast.on{opacity:1}
table.t{width:100%;border-collapse:collapse}table.t td,table.t th{padding:7px 5px;text-align:left;border-bottom:1px solid var(--line);font-size:14px}
@media print{body{background:#fff;color:#000}header,nav,.np,.toast{display:none!important}.card{border:0;background:#fff;color:#000}.scard{border:2px dashed #999}}
</style>
</head>
<body>
<header><div class="in"><img src="bluejay.png" alt="Merrill Bluejays"><b>MY MENTAL GAME</b><div class="sp"></div><span class="pill" id="who" hidden></span><a class="pill" href="#grownups">Coaches</a></div></header>
<main class="wrap" id="app"></main>
<nav>
 <a href="#home" data-t="home"><span class="i">🏠</span>Home</a>

 <a href="#breathe" data-t="breathe"><span class="i">🫁</span>Breathe</a>

</nav>
<div class="stage" id="stage"><div class="l2" id="stL"></div><div class="t" id="stT"></div><div class="muted" id="stS"></div><div class="bar"><div id="stB"></div></div><div class="row" style="margin-top:24px;justify-content:center"><button class="btn ok" id="stBack" hidden>I'm back!</button><button class="btn ghost" id="stX">Close</button></div></div>
<div class="toast" id="toast"></div>
